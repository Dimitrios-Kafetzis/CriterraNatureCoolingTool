  # ---------------------------------------------------------------------------
  # The four classes retrieved for this release. Each exists because the
  # catalogue contains entries that would otherwise have inherited an envelope
  # belonging to a different body of study.
  # ---------------------------------------------------------------------------

  - archetype: large_water_body
    display_name: Large open water body
    provenance: new
    category: blue_green
    base_cooling_score: 75
    temp_reduction_min_c: 0.1
    temp_reduction_max_c: 3.0
    evidence_confidence: medium
    building_energy_applicable: false
    suitability:
      minimum_site_area_m2: 1000
      requires_soil: moderate
      requires_irrigation: none
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: high
      stormwater: high
      public_health: medium
      urban_quality: high
    output_caveats: [water_remote_sensing_spread, water_nocturnal_warming]
    sources:
      - key: keravec2026
        finding: "Water bodies 2.1 C pedestrian-level daytime air temperature reduction, reported as largely climate-independent."
      - key: volker2013
        finding: "Meta-analysis of 27 studies: pooled cooling of 2.5 K (95% CI 1.9-3.2 K) in the warmest months, attributed to urban blue sites WHEN REMOTE-SENSING DATA ARE INCLUDED. A single pooled estimate across ponds, lakes and rivers together; it does not differentiate cooling by water-body size."
      - key: yao2023a
        finding: "Year-long field measurement of urban lakes in Nanjing and Guangzhou: weak daytime urban cool island intensity of 0.1-0.6 C, against a 1.2-1.3 C heat island intensity at night in the warm months."
      - key: ampatzidis2020
        finding: "A clear disparity exists between cooling potentials reported by remote sensing and those from field measurement or numerical simulation; at night blue spaces may exacerbate the urban heat island."
    notes: >
      The envelope floor is 0.1 C, not the 0.5 C proposed in the v1.2 review
      pack. The pack attributed a cooling magnitude near 2 C to yao2023a;
      retrieval at implementation established that the paper reports no such
      figure and instead measures 0.1-0.6 C by day. Holding the floor at 0.5
      would have made the tool claim more than its most direct field evidence
      supports, which is exactly the inflation D-008 exists to prevent. The
      ceiling stays at 3.0 C on keravec2026 and the volker2013 confidence
      interval. The width of the envelope is real and is the finding: the
      remote-sensing-inclusive meta-analysis and the direct field measurements
      disagree by an order of magnitude, and ampatzidis2020 names remote sensing
      as the overestimating mode. See D-045.

  - archetype: small_constructed_water
    display_name: Small constructed water feature
    provenance: new
    category: blue_green
    base_cooling_score: 40
    temp_reduction_min_c: 0.0
    temp_reduction_max_c: 1.0
    evidence_confidence: medium
    building_energy_applicable: false
    suitability:
