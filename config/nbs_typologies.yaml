      stormwater: high
      public_health: low
      urban_quality: medium
    output_caveats: [green_roof_street_level]
    sources:
      - key: keravec2026
        finding: "Green roofs 1.1 C pedestrian-level daytime air temperature reduction, lowest-performing green measure in the synthesis."
      - key: zolch2016
