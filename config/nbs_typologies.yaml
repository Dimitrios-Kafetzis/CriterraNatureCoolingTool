# NbS Typology Library
#
# The performance assumptions for each of the 14 supported nature-based solution
# typologies. Every performance value carries a `sources` list; CI rejects any
# typology whose performance values are uncited.
#
# All temperature values are DAYTIME, PEDESTRIAN-LEVEL AIR temperature reductions
# in degrees Celsius, relative to an equivalent unimproved site. They are NOT
# surface temperatures and NOT thermal comfort indices.
#
# temp_reduction_min_c / temp_reduction_max_c define the literature envelope.
# Site adjustment may reduce an estimate below this envelope but never above it
# (decision D-008; Methodology Report section 5.5).
#
# Derivations: docs/methodology/EVIDENCE-TABLES.md
# Source keys: docs/methodology/BIBLIOGRAPHY.md

version: "2026.08.03"

typologies:
  - nbs_id: "01"
    nbs_type: street_tree_planting
    display_name: Street tree planting
    category: green
    base_cooling_score: 75
    temp_reduction_min_c: 0.5
    temp_reduction_max_c: 3.0
    evidence_confidence: high
    primary_cooling_mechanism: shade and evapotranspiration
    building_energy_applicable: true
    typical_use_context: [street_corridor, residential, mixed_use, commercial, campus]
    suitability:
      minimum_site_area_m2: 100
      requires_soil: limited
      requires_irrigation: occasional
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: medium
      stormwater: medium
      public_health: high
      urban_quality: high
    sources:
      - key: keravec2026
        finding: "Street trees: 1.5 C central estimate for pedestrian-level daytime air temperature; 4.0 +/- 1.6 C in tropical (A) and 1.7 +/- 1.4 C in arid (B) climates."
      - key: ziter2019
        finding: "Air temperature decreases nonlinearly with canopy cover, greatest cooling above ~40% cover; peak effect at 60-90 m scale."
      - key: bowler2010
        finding: "Empirical studies broadly support cooler air beneath tree canopy."
      - key: rahman2020
        finding: "Species and leaf area index materially change delivered cooling."
    notes: >
      Upper bound capped at 3.0 C rather than the tropical central estimate of
      4.0 C, which carries a +/-1.6 C interval and reflects favourable conditions.

  - nbs_id: "02"
