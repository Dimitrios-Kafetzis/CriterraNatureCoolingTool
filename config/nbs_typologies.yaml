  # library with individually retrieved literature behind them, and this release
  # keeps that evidence rather than trading it for catalogue names.
  # ---------------------------------------------------------------------------

  - archetype: street_tree_canopy
    display_name: Street tree canopy
    provenance: existing
    category: green
    base_cooling_score: 75
    temp_reduction_min_c: 0.5
    temp_reduction_max_c: 3.0
    evidence_confidence: high
    building_energy_applicable: true
    suitability:
      minimum_site_area_m2: 100
      requires_soil: limited
      requires_irrigation: occasional
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: medium
      stormwater: medium
      public_health: high
      urban_quality: high
    sources:
      - key: keravec2026
        finding: "Street trees: 1.5 C central estimate for pedestrian-level daytime air temperature; 4.0 +/- 1.6 C in tropical (A) and 1.7 +/- 1.4 C in arid (B) climates."
      - key: ziter2019
        finding: "Air temperature decreases nonlinearly with canopy cover, greatest cooling above ~40% cover; peak effect at 60-90 m scale."
      - key: bowler2010
        finding: "Empirical studies broadly support cooler air beneath tree canopy."
      - key: rahman2020
        finding: "Species and leaf area index materially change delivered cooling."
      - key: kumar2024
        finding: "Street trees measured at up to 2.8 C by in-situ monitoring, inside this envelope: newer and broader evidence supports the conservative calibration rather than overturning it."
    notes: >
      Upper bound capped at 3.0 C rather than the tropical central estimate of
      4.0 C, which carries a +/-1.6 C interval and reflects favourable conditions.

