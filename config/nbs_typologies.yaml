    display_name: Shaded pedestrian corridor
    category: green
    base_cooling_score: 80
    temp_reduction_min_c: 0.5
    temp_reduction_max_c: 3.0
    evidence_confidence: medium
    primary_cooling_mechanism: continuous shade and evapotranspiration
    building_energy_applicable: false
    typical_use_context: [street_corridor, public_space, mixed_use, campus, memorial]
    suitability:
      minimum_site_area_m2: 200
      requires_soil: limited
      requires_irrigation: occasional
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: medium
      stormwater: low
      public_health: high
      urban_quality: high
    sources:
      - key: keravec2026
        finding: "Street trees 1.5 C and shading devices 2.0 C pedestrian-level daytime air temperature reduction."
      - key: zolch2016
        finding: "Shade placement in heat-exposed locations outperforms maximising total green cover; trees -13% PET."
    notes: >
      Scored above street trees because shade is placed where exposure occurs.
      The narrow-street effect reported by keravec2026 is an urban-form effect,
      not an NbS intervention, and is deliberately not inherited.

