name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests (pytest + coverage)
        run: pytest

  frontend:
    name: Frontend (lint · format · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (for the OpenAPI schema)
        run: pip install -e "../backend"
      - name: Install
        run: npm ci
      - name: Generated API types are current (D-030 drift gate)
        run: |
          npm run generate
          git diff --exit-code -- openapi.json src/api/schema.ts
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test

  package:
    name: Packaged app (wheel · smoke · container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the wheel with the frontend embedded (D-035)
        run: |
          pip install build
          tools/build_wheel.sh
      - name: Smoke-check the installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls backend/dist/*.whl)[serve]"
          export XDG_DATA_HOME=/tmp/smoke-data
          /tmp/smoke/bin/nature-cooling serve --port 8123 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/api/meta > /tmp/meta.json 2>/dev/null && break
            sleep 1
          done
          cat /tmp/meta.json
          python -c "import json; m = json.load(open('/tmp/meta.json')); assert m['engine_version'] and m['methodology_version'], m"
          curl -fsS http://127.0.0.1:8123/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8123/projects/deep-link | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/nonexistent)" = 404
      - name: Container image builds from the wheel
        run: docker build -t nature-cooling:ci .

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build (strict)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
      - name: The published site makes no third-party requests (D-035)
        run: |
          if grep -rE 'src="https?://' site --include='*.html'; then exit 1; fi
          if grep -rE '<link[^>]*rel="(stylesheet|preload)"[^>]*href="https?://' site --include='*.html'; then exit 1; fi
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-deploy:
    name: Docs site (publish)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
