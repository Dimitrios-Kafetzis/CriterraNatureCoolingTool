      stormwater: low
      public_health: low
      urban_quality: medium
    sources:
      - key: keravec2026
        finding: "Green walls 3.0 C central, with fivefold spread across climate subzones (Cwa 5.7, BWh 5.5, Csa 2.9, Cfa/Cfb 1.3, Af 1.0 C)."
      - key: zolch2016
        finding: "Green facades -5% to -10% PET, below trees at -13%."
    notes: >
      Sources conflict outright: the synthesis ranks green walls near the top on
      air temperature while the micro-scale comparison ranks them below trees on
      comfort, plausibly explained by near-wall measurement position. Low
      confidence, conservative envelope, explicit caveat in tool output.

