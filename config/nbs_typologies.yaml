      requires_soil: moderate
      requires_irrigation: none
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: medium
      stormwater: high
      public_health: low
      urban_quality: medium
    output_caveats: [small_water_negligible_daytime, water_nocturnal_warming]
    sources:
      - key: jacobs2020
        finding: "Sixteen simulated urban water bodies: afternoon air temperature in surrounding spaces reduced by typically 0.2 C, maximum 0.6 C. Of 20 papers synthesised for water bodies without fountains, 14 (70%) report an air-temperature effect of 1 C or less; local thermal effects of small water bodies can be considered negligible in design practice."
      - key: yao2023b
        finding: "Field measurement of an urban pond: moderate daytime cooling of 0.6 C against a reference soil site, and a pronounced nocturnal warming effect of 1.8 C."
      - key: ampatzidis2020
        finding: "Blue-space cooling varies with time of day, season and location; at night blue spaces may exacerbate the urban heat island, and sensible cooling can be offset by increased water-vapour content."
    notes: >
      THIS ARCHETYPE MUST NEVER BE INTERPOLATED WITH large_water_body BY AREA.
      The two are separate bodies of study, not two points on a dose-response
      curve: the size-threshold literature is land-surface-temperature only,
      and no published curve connects them on air temperature. Without this
      split, constructed wetlands, retention ponds, detention basins and water
      squares would have inherited blue_green_corridor at 1.0-3.0 C on family
      resemblance and been overstated roughly threefold. The floor is a genuine
      zero because jacobs2020 concludes the daytime effect is negligible in
      design practice.

  - archetype: non_canopy_vegetation
    display_name: Non-canopy vegetation
    provenance: new
    category: green
    base_cooling_score: 50
    temp_reduction_min_c: 0.0
    temp_reduction_max_c: 1.5
    evidence_confidence: medium
    building_energy_applicable: false
    suitability:
