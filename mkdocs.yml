# Documentation site (D-035): MkDocs + Material rendering the existing
# corpus under docs/ — no page is authored twice. The README becomes the
# landing page and the brand fonts are injected at build time by
# tools/mkdocs_hooks.py; the published site makes no third-party requests
# (fonts self-hosted, Material's Mermaid bundled, font: false).

site_name: Nature for Cooling Rapid Assessment Tool
site_description: >-
  Open-source, screening-level decision support for evaluating and
  prioritising nature-based solutions for urban cooling.
site_url: https://dimitrios-kafetzis.github.io/CriterraNatureCoolingTool/
repo_url: https://github.com/Dimitrios-Kafetzis/CriterraNatureCoolingTool
repo_name: Dimitrios-Kafetzis/CriterraNatureCoolingTool
copyright: >-
  © Criterra — Nature for Cooling is a Criterra product.
  Code and methodology licensed Apache-2.0.
docs_dir: docs

exclude_docs: |
  requirements.txt

hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  font: false
  # Injected from frontend/public by tools/mkdocs_hooks.py — one copy of each
  # brand asset in the repository, as with the fonts (D-036, D-042).
  logo: assets/criterra-lockup.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy

extra_css:
  - assets/criterra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Methodology:
      - Overview: methodology/README.md
      - Methodology Report: methodology/METHODOLOGY.md
      - Evidence tables: methodology/EVIDENCE-TABLES.md
      - Bibliography: methodology/BIBLIOGRAPHY.md
      - Sensitivity analysis: methodology/SENSITIVITY-ANALYSIS.md
  - Architecture: ARCHITECTURE.md
  - UX specification: UX-SPECIFICATION.md
  - Decision log: DECISIONS.md
  - V2 vision: V2-VISION.md
  - Release briefs:
      - v2.1 — Map picker & autofill: V2.1-BRIEF.md
      - v2.0 — NbS catalogue & packages: V1.2-BRIEF.md
      - v2.0 review pack — curated catalogue: V1.2-REVIEW-PACK.md
      - v2.0 review pack — archetypes & availability: V1.2-REVIEW-PACK-2.md
      - Phase 3 — API service: PHASE-3-BRIEF.md
      - Phase 4 — Web application: PHASE-4-BRIEF.md
      - Phase 5 — Report export: PHASE-5-BRIEF.md
      - Phase 6 — Packaging & publication: PHASE-6-BRIEF.md
      - Phase 7 — v1.0 stabilisation: PHASE-7-BRIEF.md
