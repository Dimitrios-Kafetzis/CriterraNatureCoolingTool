[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "criterra-nature-cooling"
version = "1.1.0"
description = "Screening-level decision-support engine for evaluating and prioritising nature-based solutions for urban cooling"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Criterra" }]
keywords = ["nature-based-solutions", "urban-cooling", "urban-heat", "decision-support", "climate-adaptation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "platformdirs>=4.0",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-openpyxl",
    "httpx>=0.27",
    "pypdf>=5.0",
    "build>=1.2",
]

[project.scripts]
nature-cooling = "nature_cooling.cli:main"

[project.urls]
Repository = "https://github.com/Dimitrios-Kafetzis/CriterraNatureCoolingTool"

[tool.hatch.build.targets.wheel]
packages = ["src/nature_cooling"]
# The embedded app data (frontend build, config, bibliography) is staged into
# src/nature_cooling/_bundled by tools/build_wheel.sh and is gitignored;
# `artifacts` admits it into the wheel despite the VCS ignore (D-035).
artifacts = ["/src/nature_cooling/_bundled"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# The report catalog's typography is deliberate (en dashes, multiplication
# sign), matching the web application's message catalog.
allowed-confusables = ["–", "×"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["nature_cooling"]

[[tool.mypy.overrides]]
# uvicorn ships behind the `serve` extra and is absent from the dev
# environment; the CLI imports it lazily and handles its absence.
module = "uvicorn"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nature_cooling --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/nature_cooling"]
