      requires_irrigation: reliable
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: low
      stormwater: low
      public_health: medium
      urban_quality: medium
    output_caveats: [shade_structure_comfort_not_air]
    sources:
      - key: chafer2020
        finding: "The only measured comparison of a vine-covered pergola against an identical bare support: maximum daytime air temperature difference 2.5 C (45.3 C over the bare ropes against 42.9 C under the greenery), west-oriented pergolas, Mediterranean climate."
      - key: ouyang2024
        finding: "Field measurement of shading structures on both axes: air temperature reduced 1.42 C (natural) and 1.31 C (artificial), while mean radiant temperature was reduced 15.93 C and 13.71 C respectively - an order of magnitude apart."
      - key: colter2019
        finding: "Sparse and open canopies group with solid constructed shade structures rather than with dense canopy: PET relief under Parkinsonia, Prosopis and ramadas was 2.9-4.3 C worse than under dense-canopy species."
    notes: >
      THE keravec2026 "SHADING DEVICES 2.0 C" FIGURE IS DELIBERATELY NOT USED
      HERE. That category aggregates area-scale shading, where the cooled air
      volume persists against advection; a pergola shades roughly 10 m2.
      Applying it would rate a pergola above measured tree canopy, which
      ouyang2024 measures at 1.42 C. The same figure IS used by the
      permeable_shaded_hardscape archetype, where the scale matches.
      Low confidence with n=1 for the actual intervention. The ceiling of 2.5 C
      is chafer2020's measured peak; note that paper's abstract headlines
      "up to 5 C", which is greenery against UNSHADED conditions rather than
      against the bare pergola, and is not the like-for-like contrast this
      envelope needs.

  # ---------------------------------------------------------------------------
  # The two derived classes. Retrieval established that no class-specific
  # evidence exists, so each is bounded from an adjacent class with the
  # bounding argument stated. The absence itself is cited (kumar2024), which
  # makes it a finding rather than a search failure.
  # ---------------------------------------------------------------------------

  - archetype: productive_canopy
    display_name: Productive tree canopy
    provenance: derived
    category: green
    base_cooling_score: 60
    temp_reduction_min_c: 0.5
    temp_reduction_max_c: 2.0
    evidence_confidence: low
    building_energy_applicable: false
    suitability:
      minimum_site_area_m2: 500
      requires_soil: moderate
      requires_irrigation: reliable
      unsuitable_climate_zones: []
    co_benefit_defaults:
      biodiversity: medium
      stormwater: medium
      public_health: high
      urban_quality: high
    output_caveats: [productive_evidence_gap]
    sources:
      - key: kumar2024
        finding: "Review of 51 green-blue infrastructure types across 202 publications: allotments and city farms are among the least-studied categories, with insufficient data to quantify their cooling."
      - key: ziter2019
        finding: "Cooling strengthens above approximately 40% canopy cover; orchard and agroforestry canopies are deliberately kept open for access and yield, so they sit below that inflection."
      - key: colter2019
        finding: "Sparse canopies perform no better than solid artificial shade, which bounds an open production canopy below a closed woodland canopy."
      - key: cheung2022
        finding: "Irrigation sustains rather than raises performance: measured agricultural cooling was 0.09-0.43 C against modelled potentials of 2.1-2.5 C, and irrigation increases the daily minimum air temperature as stored heat is released at night."
    notes: >
      Derived, not retrieved: bounded below dense_tree_canopy on the ziter2019
      canopy-cover inflection and the colter2019 sparse-canopy finding, and
      given the same envelope as established_park with a lower evidence rating.
      Irrigation is NOT credited as extra degrees - the cheung2022 contrast is
      specific to agricultural fields, and the same paper measures -2 to -1 C
      in irrigated urban parks, so no general claim that models overstate
      irrigation cooling is made here.

