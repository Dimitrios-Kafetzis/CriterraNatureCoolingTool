      biodiversity: medium
      stormwater: medium
      public_health: low
      urban_quality: medium
    output_caveats: [non_canopy_surface_not_air]
    sources:
      - key: armson2012
        finding: "Measured on the same plots: grass reduced maximum SURFACE temperature by up to 24 C but had little effect upon GLOBE temperature, while shading reduced globe temperature by 5-7 C. Grass has little effect on local air or globe temperature; tree shade provides effective local cooling."
      - key: gill2013
        finding: "Modelled: grass cooling can be reduced or lost in summer droughts when soils dry out, an effect projected to become more pronounced under climate change."
      - key: kraemer2022
        finding: "Field measurement under drought: the grass-dominated park was the hottest area during the daytime, while the tree-dominated park was consistently cooler."
      - key: bowler2010
        finding: "Parks containing trees reported cooler than open turf, stated qualitatively."
      - key: kumar2024
        finding: "Typology-resolved review placing grass and herbaceous systems well below canopy systems for air-temperature cooling."
    notes: >
      armson2012 is decisive because it measures both metrics on the same plots
      and so isolates the surface/air conflation that inflates most published
      grass figures: cutting surface temperature by 24 C while barely moving
      globe temperature is the whole finding. The floor is a genuine zero for
      dry or dormant planting, on gill2013 and kraemer2022.

  - archetype: vegetated_shade_structure
    display_name: Vegetated shade structure
    provenance: new
    category: hybrid
    base_cooling_score: 55
    temp_reduction_min_c: 0.0
    temp_reduction_max_c: 2.5
    evidence_confidence: low
