      - key: bowler2010
        finding: "Tree-containing green sites outperform open green space."
    notes: >
      No schoolyard-specific synthesis found; values inherited from small green
      areas with trees at matching spatial scale. The typology's distinct value
      is exposure of a vulnerable group, expressed through vulnerability and
      equity scoring rather than through inflated cooling.

