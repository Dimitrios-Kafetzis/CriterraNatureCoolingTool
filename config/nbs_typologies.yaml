      biodiversity: high
      stormwater: high
      public_health: high
      urban_quality: high
    sources:
      - key: keravec2026
        finding: "Best-performing individual NbS measures cluster at 2.0-3.0 C; no synthesis estimate exists for combined packages."
      - key: gunawardena2017
        finding: "Combined green and blue features offer synergistic ecosystem benefits, stated qualitatively and not quantified."
    notes: >
      The draft methodology's 3.5 C upper bound was rejected: no retrieved source
      quantifies super-additive cooling from combining measures. Capped at the
      best-evidenced single-measure ceiling. The package's advantage is expressed
      as co-benefit breadth and robustness, not additional degrees.
