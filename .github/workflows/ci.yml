name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests (pytest + coverage)
        run: pytest

  frontend:
    name: Frontend (lint · format · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (for the OpenAPI schema)
        run: pip install -e "../backend"
      - name: Install
        run: npm ci
      - name: Generated API types are current (D-030 drift gate)
        run: |
          npm run generate
          git diff --exit-code -- openapi.json src/api/schema.ts
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: The default build makes no third-party request (D-030, D-047.1)
        working-directory: .
        run: tools/check_no_third_party_requests.sh frontend/dist

  package:
    name: Packaged app (wheel · smoke · container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the wheel with the frontend embedded (D-035)
        run: |
          pip install build
          tools/build_wheel.sh
      - name: Smoke-check the installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls backend/dist/*.whl)[serve]"
          export XDG_DATA_HOME=/tmp/smoke-data
          /tmp/smoke/bin/nature-cooling serve --port 8123 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/api/meta > /tmp/meta.json 2>/dev/null && break
            sleep 1
          done
          cat /tmp/meta.json
          python -c "import json; m = json.load(open('/tmp/meta.json')); assert m['engine_version'] and m['methodology_version'], m"
          curl -fsS http://127.0.0.1:8123/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8123/projects/deep-link | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/nonexistent)" = 404
          # The map works offline from data inside the wheel (D-047.1), so the
          # installed package — not the checkout — is where that is proved.
          curl -fsS http://127.0.0.1:8123/api/geo/basemap | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['countries']) > 150, len(d['countries'])"
          curl -fsS -X POST http://127.0.0.1:8123/api/geo/lookup \
            -H 'Content-Type: application/json' \
            -d '{"latitude": 37.9838, "longitude": 23.7275}' > /tmp/lookup.json
          python -c "import json; d = json.load(open('/tmp/lookup.json')); assert d['country']['iso_a2'] == 'GR', d; assert d['climate']['zone'] == 'temperate', d"
          # The example images ship inside the wheel and are served from it
          # (v2.3, D-051): the manifest answers, and a declared image comes
          # back as actual WebP bytes.
          curl -fsS http://127.0.0.1:8123/api/images/manifest > /tmp/images.json
          python -c "import json; m = json.load(open('/tmp/images.json')); assert m['images'], 'wheel serves no example images'"
          first="$(python -c "import json; print(json.load(open('/tmp/images.json'))['images'][0]['file'])")"
          curl -fsS "http://127.0.0.1:8123/api/images/$first" -o /tmp/example.webp
          python -c "import pathlib; head = pathlib.Path('/tmp/example.webp').read_bytes()[:16]; assert head[:4] == b'RIFF' and head[8:12] == b'WEBP', head"
      - name: Bundled datasets and the map library ship with the licences that permit them
        run: |
          # Three datasets and one JavaScript library travel inside the wheel,
          # and some require attribution as a condition of their licence. The
          # backend suite checks the repository; this checks the artefact that
          # is actually shipped.
          site_packages="$(/tmp/smoke/bin/python -c 'import nature_cooling, pathlib; print(pathlib.Path(nature_cooling.__file__).parent)')"
          geo="$site_packages/_bundled/data/geo"
          for required in countries.json.z basemap.json koppen_geiger.json \
                          koppen_geiger_1991_2020_0p1.bin.z places.json.z ATTRIBUTION.md \
                          LICENCE-naturalearth.txt LICENCE-koppen-CC-BY-4.0.txt; do
            test -s "$geo/$required" || { echo "missing from the wheel: $required"; exit 1; }
          done
          grep -q 'Creative Commons Attribution 4.0 International Public License' \
            "$geo/LICENCE-koppen-CC-BY-4.0.txt"
          grep -q '10.1038/s41597-023-02549-6' "$geo/ATTRIBUTION.md"
          # Leaflet is bundled into the frontend build (D-049.5); its BSD-2
          # text must travel with the embedded webapp.
          grep -q 'BSD 2-Clause License' "$site_packages/_bundled/webapp/LICENCE-leaflet.txt"
          # The example images (v2.3, D-051): every manifest-declared file
          # must be inside the wheel with the attribution document beside it.
          images="$site_packages/_bundled/data/images"
          test -s "$images/manifest.json"
          test -s "$images/ATTRIBUTION.md"
          python - "$images" <<'PY'
          import json, pathlib, sys
          images = pathlib.Path(sys.argv[1])
          declared = json.loads((images / "manifest.json").read_text())["images"]
          assert declared, "empty image manifest in the wheel"
          for image in declared:
              path = images / image["file"]
              assert path.is_file() and path.stat().st_size > 0, f"missing from the wheel: {image['file']}"
          print(f"OK: {len(declared)} example images inside the wheel")
          PY
          echo "OK: bundled content ships with its licences and attribution"
      - name: Runtime request gate (D-049.8)
        run: |
          # The static grep proves no third-party URL sits in the build; this
          # proves what a running deployment actually requests. Drives the
          # installed wheel headlessly through the runner's system Chrome —
          # unconfigured (zero external requests across a full assessment),
          # configured against a local mock host (tiles go there and only
          # there), and configured against a dead port (degrades to the
          # bundled outlines).
          python -m venv /tmp/pw
          /tmp/pw/bin/pip install playwright
          /tmp/pw/bin/python tools/check_runtime_requests.py \
            --server-python /tmp/smoke/bin/python --dist -
      - name: Container image builds from the wheel
        run: docker build -t nature-cooling:ci .

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build (strict)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
      - name: The published site makes no third-party requests (D-035)
        run: tools/check_no_third_party_requests.sh site
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-deploy:
    name: Docs site (publish)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
