      - key: santamouris2014
        finding: "0.3-3 K average urban ambient reduction, but only for city-scale deployment in simulation studies, not single-building installation."
    notes: >
      Benefits are concentrated at roof level and inside the building beneath.
      The tool states in its output that green-roof benefits are principally
      building-level rather than street-level.

