      urban_quality: medium
    output_caveats: [productive_evidence_gap, irrigation_sustains_not_raises]
    sources:
      - key: kumar2024
        finding: "Allotments and city farms are among the least-studied of 51 green-blue infrastructure types, with insufficient data to quantify their cooling."
      - key: rost2020
        finding: "The best available allotment-garden measurement: 13 Berlin complexes averaged 2.7 K cooler than built-up areas AT NIGHT. Nocturnal only by design, so it cannot support a daytime value."
      - key: armson2012
        finding: "Ground-level vegetation cuts surface temperature substantially while barely affecting globe temperature, which is the basis of the inherited envelope."
      - key: cheung2022
        finding: "Measured agricultural cooling 0.09-0.43 C against modelled potentials of 2.1-2.5 C; irrigation raises the daily minimum air temperature at night."
    notes: >
      Derived: inherits the non_canopy_vegetation envelope, because cultivated
      ground-level planting is ground-level vegetation whose cover is
      periodically broken between crops. Rated low rather than medium because
      the inheritance is an argument rather than a measurement of this class.
      The evidence gap is CITABLE (kumar2024) rather than merely unfilled,
      which is a stronger position than the rain-garden precedent where no
      source was found at all.
