# NbS Typology Library — cooling archetypes and catalogue entries
#
# The library has two levels since version 2026.08.04 (D-044).
#
# An ARCHETYPE is a cited evidence class. It carries every performance value —
# temperature envelope, base cooling score, evidence rating, suitability
# conditions, co-benefit defaults — and the citations behind them. There are 18.
#
# A TYPOLOGY is one of the 110 curated catalogue entries. It carries identity,
# family, availability, and the one archetype it inherits from. It carries NO
# performance value of its own.
#
# This is how the UNEP catalogue is adopted without weakening the evidence rules:
# solution-specific cooling literature does not exist for 110 typologies, and
# inventing 110 envelopes would have manufactured precision the catalogue does
# not contain. Instead an entry inherits a CITED envelope and every result names
# the evidence class it inherited from — a Miyawaki forest reports its cooling on
# the dense-canopy evidence, and says so.
#
# All temperature values are DAYTIME, PEDESTRIAN-LEVEL AIR temperature reductions
# in degrees Celsius, relative to an equivalent unimproved site. They are NOT
# surface temperatures and NOT thermal comfort indices. Several of the sources
# below report both, and keeping them apart is the single most important thing
# this library does.
#
# temp_reduction_min_c / temp_reduction_max_c define the literature envelope.
# Site adjustment may reduce an estimate below this envelope but never above it
# (decision D-008; Methodology Report section 5.5).
#
# Derivations: docs/methodology/EVIDENCE-TABLES.md
# Source keys: docs/methodology/BIBLIOGRAPHY.md

version: "2026.08.05"

